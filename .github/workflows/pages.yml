name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos públicos
        run: |
          mkdir _site
          cp index.html styles.css app.js inventory-utils.js catalog.js firebase-config.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png _site/
      - name: Empaquetar aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
